id: "kandev-plugin-mindmap"
api_version: 1
version: "0.0.1"
display_name: "Mind Map"
description: "An agentic, multiplayer mind map. Phase 0: scaffold plus capability probes."
author: "Prithpal-Sooriya"
categories: ["tools"]
license: "MIT"
homepage: "https://github.com/Prithpal-Sooriya/kandev-plugin-mindmap"
repo_url: "https://github.com/Prithpal-Sooriya/kandev-plugin-mindmap"

# api_read: messages needs 0.91.1+. The SDK is pinned in .kandev-sdk-ref.
min_kandev_version: "0.97.0"

capabilities:
  agent_invoke: true
  agent_conversation: true
  state: true
  user_state: true
  api_read: ["tasks", "sessions", "messages", "agent_profiles", "workspaces", "repositories"]
  api_write: ["tasks", "messages"]
  events:
    - "task_session.state_changed"
    - "message.added"
    - "agent.completed"
    - "agent.failed"

agent_tools:
  - name: mindmap_ping
    description: "Spike probe. Records the call (task id, session id, arguments) and returns 'pong'."
    surfaces: [kanban-task, office-task]
    input_schema:
      type: object
      properties:
        msg:
          type: string
          description: "Any short text."
        blob:
          type: string
          description: "Optional large payload, used to probe argument size limits."
      additionalProperties: false
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

# All spike webhooks are authenticated (Kandev identity required).
webhooks:
  - key: "debug-launch"
    description: "POST {agent_profile_id, prompt?, workspace_id?}: creates and launches a task via Host.Tasks().Create."
    method: "POST"
    access: authenticated
    max_body_bytes: 1048576
  - key: "probe"
    description: "GET: listener port, subprocess probe, sqlite probe, cloudflared lookup."
    method: "GET"
    access: authenticated
  - key: "agent-profiles"
    description: "GET: agent profiles via Host.AgentProfiles().List."
    method: "GET"
    access: authenticated
  - key: "logs"
    description: "GET ?name=ping|events: tail of a spike log file."
    method: "GET"
    access: authenticated
  - key: "hold"
    description: "GET ?secs=N: holds the request open N seconds (long-poll ceiling probe)."
    method: "GET"
    access: authenticated
  - key: "echo-size"
    description: "POST: returns the received body length (webhook/gRPC size probe)."
    method: "POST"
    access: authenticated
    max_body_bytes: 16777216
  - key: "tunnel-test"
    description: "POST: if cloudflared is installed, runs a ~20s quick tunnel against the probe server."
    method: "POST"
    access: authenticated
  - key: "task-ops"
    description: "POST {op: get|delete, task_id}: task inspection and plugin-owned tree deletion (cleanup of spike tasks)."
    method: "POST"
    access: authenticated

config_schema:
  type: object
  properties:
    agent_profile:
      type: string
      format: agent-profile
      title: "Default agent profile"
      description: "Agent profile used for mind map runs. Leave empty to choose per run."

ui:
  bundle: "/ui/bundle.js"
  styles:
    - "/ui/plugin.css"

runtime:
  type: binary
  executables:
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"
