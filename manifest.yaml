id: "kandev-plugin-mindmap"
api_version: 1
version: "0.3.2"
display_name: "Mind Map"
description: "An agentic, multiplayer mind map: you and your agents branch out, research, reorganise and compile docs together."
author: "Prithpal-Sooriya"
categories: ["tools"]
license: "MIT"
homepage: "https://github.com/Prithpal-Sooriya/kandev-plugin-mindmap"
repo_url: "https://github.com/Prithpal-Sooriya/kandev-plugin-mindmap"

# api_read: messages needs 0.91.1+. The SDK is pinned in .kandev-sdk-ref.
min_kandev_version: "0.97.0"

capabilities:
  agent_invoke: true
  agent_conversation: true
  state: true
  user_state: true
  api_read: ["tasks", "sessions", "messages", "agent_profiles", "workspaces", "repositories"]
  api_write: ["tasks", "messages"]
  events:
    - "task_session.state_changed"
    - "message.added"
    - "message.updated"
    - "agent.completed"
    - "agent.failed"

# BEGIN generated agent_tools: edit contract/tools/*.json, then run `npm run sync:tools`
agent_tools:
  - name: context
    description: "Call this FIRST in every mind map run, and again if you lose track. Returns your brief and goal, run mode (apply = writes go live; propose = writes become a proposal a human reviews), template and lens, your node with its ancestors and an id-tagged outline of its subtree, budget left (nodes, sub-agents, depth), your open ask_human questions with any answers, and nodes other agents have claimed nearby. Read-only."
    surfaces: [kanban-task, office-task]
    annotations: {"read_only_hint":true,"destructive_hint":false,"idempotent_hint":true,"open_world_hint":false}
    input_schema: {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "subtree_depth": {
            "type": "integer",
            "minimum": 0,
            "maximum": 6,
            "description": "Levels of your subtree to include. Default 2."
          }
        }
      }
  - name: read
    description: "Read part of the map as an indented, id-tagged outline: one line per node with [id], kind, status, source count and confidence. Use it to see a branch before adding to it or reorganising it. Defaults to the whole map from the root, 3 levels deep, without bodies. Large results are paged: pass next_cursor back as cursor. Read-only."
    surfaces: [kanban-task, office-task]
    annotations: {"read_only_hint":true,"destructive_hint":false,"idempotent_hint":true,"open_world_hint":false}
    input_schema: {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "node_id": {
            "type": "string",
            "maxLength": 64,
            "description": "Start here instead of the root. Node id (nd_...) or an @ref you set earlier in this run."
          },
          "depth": {
            "type": "integer",
            "minimum": 1,
            "maximum": 10,
            "description": "Levels below the start node. Default 3."
          },
          "include_bodies": {
            "type": "boolean",
            "description": "Include markdown bodies and sources. Default false; turn on only for small branches."
          },
          "cursor": {
            "type": "string",
            "maxLength": 200,
            "description": "next_cursor from a previous read, to get the next page."
          },
          "limit": {
            "type": "integer",
            "minimum": 1,
            "maximum": 500,
            "description": "Max nodes per page. Default 200."
          },
          "map_id": {
            "type": "string",
            "maxLength": 64,
            "description": "Read another map in the same workspace (read-only). Omit for your own map."
          }
        }
      }
  - name: search
    description: "Find nodes by text and filters. Use it before adding to avoid duplicates, and to find related ideas worth linking. Matches titles, bodies, tags and source titles. Give a query, filters, or both. Results are id-tagged lines with the node's path. Read-only."
    surfaces: [kanban-task, office-task]
    annotations: {"read_only_hint":true,"destructive_hint":false,"idempotent_hint":true,"open_world_hint":false}
    input_schema: {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "query": {
            "type": "string",
            "maxLength": 500,
            "description": "Words to match. Optional if you give filters."
          },
          "kinds": {
            "type": "array",
            "maxItems": 9,
            "items": {
              "type": "string",
              "enum": [
                "topic",
                "idea",
                "research",
                "example",
                "question",
                "decision",
                "risk",
                "action",
                "doc"
              ]
            },
            "description": "Only these kinds."
          },
          "tags": {
            "type": "array",
            "maxItems": 20,
            "items": {
              "type": "string",
              "maxLength": 40
            },
            "description": "Only nodes with all of these tags."
          },
          "statuses": {
            "type": "array",
            "maxItems": 6,
            "items": {
              "type": "string",
              "enum": [
                "idle",
                "claimed",
                "running",
                "review",
                "done",
                "failed"
              ]
            },
            "description": "Only these statuses."
          },
          "scope": {
            "type": "string",
            "enum": [
              "map",
              "subtree",
              "workspace"
            ],
            "description": "map (default) = your map; subtree = under node_id; workspace = every map in the workspace."
          },
          "node_id": {
            "type": "string",
            "maxLength": 64,
            "description": "Subtree root, required when scope is subtree. Node id (nd_...) or an @ref you set earlier in this run."
          },
          "limit": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100,
            "description": "Max results. Default 20."
          }
        }
      }
  - name: add
    description: "Add one or more nodes, optionally nested, in one call. Use it for ideas, research findings, real-world examples (kind example with a source), questions, risks, decisions and actions. Batch related nodes into one call (up to 100 nodes, 3 levels deep) instead of many small calls. Cite evidence in sources, not in the body. Search first to avoid duplicates. Set ref on a node to refer to it later as @ref. Counts against your node budget. In propose mode the nodes appear as a proposal for review."
    surfaces: [kanban-task, office-task]
    annotations: {"read_only_hint":false,"destructive_hint":false,"idempotent_hint":false,"open_world_hint":false}
    input_schema: {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "parent_id": {
            "type": "string",
            "maxLength": 64,
            "description": "Where to add. Default: your run's node. Node id (nd_...) or an @ref you set earlier in this run."
          },
          "after_id": {
            "type": "string",
            "maxLength": 64,
            "description": "Insert after this existing child of parent_id. Default: after the last child."
          },
          "nodes": {
            "type": "array",
            "minItems": 1,
            "maxItems": 50,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "title"
              ],
              "properties": {
                "ref": {
                  "type": "string",
                  "maxLength": 48,
                  "description": "Optional label (a-z0-9_-) so later calls can say @label instead of the id."
                },
                "title": {
                  "type": "string",
                  "maxLength": 200,
                  "description": "One line, specific. Required."
                },
                "kind": {
                  "type": "string",
                  "enum": [
                    "idea",
                    "research",
                    "example",
                    "question",
                    "decision",
                    "risk",
                    "action",
                    "topic"
                  ],
                  "description": "Default idea. Use example for real-world cases (with a source), research for findings, question for open questions."
                },
                "body": {
                  "type": "string",
                  "maxLength": 65536,
                  "description": "Markdown detail. Keep it short; put evidence in sources."
                },
                "tags": {
                  "type": "array",
                  "maxItems": 20,
                  "items": {
                    "type": "string",
                    "maxLength": 40
                  },
                  "description": "Short lowercase tags, no spaces or #, e.g. [\"pricing\", \"b2b\"]."
                },
                "confidence": {
                  "type": "number",
                  "minimum": 0,
                  "maximum": 1,
                  "description": "How sure you are, 0-1. Set it for claims."
                },
                "sources": {
                  "type": "array",
                  "maxItems": 50,
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": [
                      "url"
                    ],
                    "properties": {
                      "url": {
                        "type": "string",
                        "maxLength": 2048,
                        "description": "Absolute http(s) URL of the evidence."
                      },
                      "title": {
                        "type": "string",
